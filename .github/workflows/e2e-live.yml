name: Playwright against the live site

# Runs after every push to main (waiting for Cloudflare to publish), or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: 'Live URL to test'
        required: true
        default: 'https://english-quest.rasulovnazim.workers.dev/'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare to publish this commit
        run: sleep 150
      - run: npx playwright test
        env:
          CI: 'true'
          BASE_URL: ${{ inputs.url || 'https://english-quest.rasulovnazim.workers.dev/' }}
          # Optional repository secret: the Worker's ADMIN_PASSWORD, so tests can unlock the key gate.
          GATE_ADMIN: ${{ secrets.GATE_ADMIN }}
          GATE_URL: ${{ secrets.GATE_ADMIN && (inputs.url || 'https://english-quest.rasulovnazim.workers.dev/') || '' }}
